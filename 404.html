<script>
  // 旧链接兜底：以前博客挂在根域名下，这里把未知路径转到博客子域名

    var target = 'https://blog.yunwuhai.com' + location.pathname + location.search + location.hash;
    document.write('<meta http-equiv="refresh" content="0;url=' + target.replace(/"/g, '%22') + '">');
    location.replace(target);
  })();
</script>
