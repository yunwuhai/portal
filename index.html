<style>
  :root {
    --bg: #f4f5f7;
    --card: rgba(255, 255, 255, .78);
    --border: rgba(15, 23, 42, .08);
    --text: #1a1f27;
    --muted: #6b7280;
    --accent: #4a6fa5;
    --accent-soft: rgba(74, 111, 165, .12);
    --shadow: 0 10px 30px rgba(15, 23, 42, .07);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --card: rgba(28, 31, 37, .72);
      --border: rgba(255, 255, 255, .09);
      --text: #e8eaee;
      --muted: #9aa3ad;
      --accent: #8fb0dd;
      --accent-soft: rgba(143, 176, 221, .14);
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    z-index: 0;
    left: 50%;
    top: -22vh;
    width: 120vw;
    height: 80vh;
    transform: translateX(-50%);
    background: radial-gradient(50% 50% at 50% 50%, var(--accent-soft), transparent 70%);
    pointer-events: none;
  }
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    text-align: center;
    animation: rise .45s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }

  .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--card);
    border: 3px solid var(--card);
    box-shadow: var(--shadow);
  }
  h1 { margin: 18px 0 4px; font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .handle { margin: 0; font-size: 13.5px; letter-spacing: .4px; color: var(--muted); }
  .bio { margin: 14px auto 28px; max-width: 34em; font-size: 14.5px; line-height: 1.75; color: var(--muted); }

  .links { display: grid; gap: 12px; }
  a.link {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    text-decoration: none; color: inherit;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  a.link:hover, a.link:focus-visible {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 14px 34px rgba(74, 111, 165, .18);
    outline: none;
  }
  .icon {
    flex: 0 0 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .icon svg { width: 20px; height: 20px; display: block; }
  .text { flex: 1; min-width: 0; text-align: left; }
  .name { display: block; font-size: 15px; font-weight: 600; }
  .desc { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arrow { flex: 0 0 auto; color: var(--muted); transition: transform .18s ease, color .18s ease; }
  .arrow svg { width: 16px; height: 16px; display: block; }
  a.link:hover .arrow, a.link:focus-visible .arrow { transform: translateX(3px); color: var(--accent); }

  footer { margin-top: 28px; font-size: 12.5px; line-height: 1.9; color: var(--muted); }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 420px) {
    body { padding: 28px 16px; }
    h1 { font-size: 23px; }
    .avatar { width: 84px; height: 84px; }
  }
</style>
